networks:
  rajawali_net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rajawali_backend
    restart: unless-stopped
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment}
      HONEYPOT_TOKEN: ${HONEYPOT_TOKEN:?Set HONEYPOT_TOKEN in the environment}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in the environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ABUSE_CH_API_KEY: ${ABUSE_CH_API_KEY:-}
      ENV: ${ENV:-development}
    expose:
      - "8000"
    networks:
      - rajawali_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  honeypot:
    build:
      context: ./honeypot
      dockerfile: Dockerfile
    container_name: rajawali_honeypot
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      HONEYPOT_TOKEN: ${HONEYPOT_TOKEN:?Set HONEYPOT_TOKEN in the environment}
      SSH_PORT: ${SSH_HONEYPOT_PORT:-2222}
      HTTP_PORT: ${HTTP_HONEYPOT_PORT:-8080}
      ABUSE_CH_API_KEY: ${ABUSE_CH_API_KEY:-}
      ENV: ${ENV:-development}
    ports:
      - "${SSH_HONEYPOT_PORT:-2222}:2222"
      - "${HTTP_HONEYPOT_PORT:-8080}:8080"
    networks:
      - rajawali_net
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rajawali_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    expose:
      - "3000"
    networks:
      - rajawali_net
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: rajawali_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - rajawali_net
    depends_on:
      - frontend
      - backend
